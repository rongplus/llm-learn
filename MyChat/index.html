<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ChatGPT + PDF 本地知识库</title>
<style>
body { font-family: Arial; margin: 20px; }
#chat { border:1px solid #ccc; height:400px; overflow-y:auto; padding:10px; }
.user { color:blue; }
.ai { color:green; }
</style>
</head>
<body>

<h2>🤖 本地 AI + PDF 知识库</h2>

<h4>上传 PDF</h4>
<input type="file" id="pdf">
<button onclick="upload()">上传</button>
<p id="uploadStatus"></p>

<hr>

<div id="chat"></div>
<br>
<input id="input" style="width:80%">
<button onclick="send()">发送</button>

<script>
const sessionId = "web-user";
const ws = new WebSocket(`ws://${location.host}/ws/${sessionId}`);
const chat = document.getElementById("chat");

ws.onmessage = e => {
  if (e.data === "__END__") {
    chat.innerHTML += "<br>";
    return;
  }
  chat.innerHTML += `<span class="ai">${e.data}</span>`;
  chat.scrollTop = chat.scrollHeight;
};

function send() {
  const v = input.value;
  chat.innerHTML += `<div class="user">User: ${v}</div>`;
  ws.send(v);
  input.value = "";
}

async function upload() {
  const f = document.getElementById("pdf").files[0];
  if (!f) return;

  const fd = new FormData();
  fd.append("file", f);

  uploadStatus.innerText = "上传中...";
  const r = await fetch("/upload_pdf", { method:"POST", body:fd });
  const j = await r.json();
  uploadStatus.innerText = `已加入知识库（${j.chunks} 段）`;
}
</script>

</body>
</html>
